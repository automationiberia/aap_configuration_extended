---
repos:
  - repo: 'https://github.com/pre-commit/pre-commit-hooks'
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/ambv/black
    rev: 26.5.1
    hooks:
      - id: black
        name: black
        entry: black
        args: [--config=.black.cfg, --check, --diff]
        types: [python]

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: flake8
        entry: flake8
        types: [python]

  - repo: https://github.com/djdanielsson/ansible-content-prek-actions
    rev: v26.4.6
    hooks:
      - id: ansible-lint
      - id: changelog
      - id: galaxy-importer
      - id: sanity

  # Optional: does not run on default `git commit`. Invoke explicitly:
  #   pre-commit run aap-regression --hook-stage manual
  #   REGRESSION_TIERS=offline pre-commit run aap-regression --hook-stage manual
  - repo: local
    hooks:
      - id: aap-regression
        name: AAP regression suite (optional)
        entry: bash tests/scripts/run-regression.sh
        language: system
        pass_filenames: false
        stages: [manual]
        always_run: true
...
