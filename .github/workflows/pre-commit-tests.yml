---
# Pull request tests run on pull_request (sandboxed, no secrets on fork PRs).
# After the trusted pre-commit approval workflow completes, workflow_run only
# re-runs the pull_request workflow; it never checks out or executes PR code.
# Push/schedule runs populate the Ansible collections cache for external PRs.
name: pre-commit and sanity tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["pre-commit approval"]
    types: [completed]
    # Do not filter by branches here: pull_request_target runs report the PR
    # head branch (e.g. test), not the base branch (devel).
  push:
    branches: [devel]
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  approval-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.check.outputs.approved }}
      head_sha: ${{ steps.check.outputs.head_sha }}
      head_repo_full_name: ${{ steps.check.outputs.head_repo_full_name }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - name: Validate CI approval for pull request head SHA
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            let pullRequestMeta;
            let headSha;
            let headRepoFullName;

            if (context.eventName === 'pull_request') {
              const pullRequest = context.payload.pull_request;
              pullRequestMeta = { number: pullRequest.number };
              headSha = pullRequest.head.sha;
              headRepoFullName = pullRequest.head.repo.full_name;
            } else {
              const run = context.payload.workflow_run;

              if (run.conclusion !== 'success' || run.event !== 'pull_request_target') {
                core.setOutput('approved', 'false');
                core.notice(
                  `Workflow run not eligible: conclusion=${run.conclusion}, event=${run.event}`,
                  { title: 'CI approval gate' },
                );
                return;
              }

              const pullRequests = run.pull_requests ?? [];
              pullRequestMeta = pullRequests[0];
              if (!pullRequestMeta) {
                const headOwner = run.head_repository?.owner?.login ?? owner;
                const { data: openPullRequests } = await github.rest.pulls.list({
                  owner,
                  repo,
                  state: 'open',
                  head: `${headOwner}:${run.head_branch}`,
                });
                pullRequestMeta = openPullRequests.find((item) => item.head.sha === run.head_sha);
              }
              if (!pullRequestMeta) {
                core.setOutput('approved', 'false');
                core.notice('No pull request found for workflow run', { title: 'CI approval gate' });
                return;
              }

              headSha = run.head_sha;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullRequestMeta.number,
            });

            headSha = headSha || pullRequest.head.sha;
            headRepoFullName = headRepoFullName || pullRequest.head.repo.full_name;

            if (pullRequest.base.ref !== 'devel') {
              core.setOutput('approved', 'false');
              core.notice(
                `Pull request #${pullRequest.number} targets ${pullRequest.base.ref}, expected devel`,
                { title: 'CI approval gate' },
              );
              return;
            }

            if (pullRequest.state !== 'open') {
              core.setOutput('approved', 'false');
              core.notice(`Pull request #${pullRequest.number} is ${pullRequest.state}`, { title: 'CI approval gate' });
              return;
            }

            if (pullRequest.head.sha !== headSha) {
              core.setOutput('approved', 'false');
              core.notice(
                `Head SHA mismatch: pr=${pullRequest.head.sha}, expected=${headSha}`,
                { title: 'CI approval gate' },
              );
              return;
            }

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'pre-commit-approve.yml',
              head_sha: headSha,
              event: 'pull_request_target',
              status: 'completed',
              per_page: 20,
            });

            const approvalRun = runs.workflow_runs.find((item) => item.conclusion === 'success');
            if (!approvalRun) {
              core.setOutput('approved', 'false');
              core.notice(
                `No successful pre-commit approval workflow run found for ${headSha}`,
                { title: 'CI approval gate' },
              );
              return;
            }

            const { data: jobsResponse } = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: approvalRun.id,
            });
            const approvalJob = jobsResponse.jobs.find(
              (job) =>
                (job.name === 'auto-approve' || job.name === 'manual-approval') &&
                job.conclusion === 'success',
            );
            if (!approvalJob) {
              core.setOutput('approved', 'false');
              core.notice('No successful approval job found for head SHA', { title: 'CI approval gate' });
              return;
            }

            core.setOutput('approved', 'true');
            core.setOutput('head_sha', pullRequest.head.sha);
            core.setOutput('head_repo_full_name', headRepoFullName);
            core.setOutput('pr_number', String(pullRequest.number));

            core.summary
              .addHeading('CI approval gate')
              .addRaw(`- PR: #${pullRequest.number}\n`)
              .addRaw(`- Head SHA: ${pullRequest.head.sha}\n`)
              .addRaw(`- Head repository: ${headRepoFullName}\n`)
              .addRaw(`- Approval job: ${approvalJob.name}\n`)
              .addRaw('- Approved: true\n')
              .write();

  rerun-pr-tests:
    needs: approval-gate
    if: >-
      github.event_name == 'workflow_run' &&
      needs.approval-gate.outputs.approved == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Re-run pull_request tests after CI approval
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const headSha = '${{ needs.approval-gate.outputs.head_sha }}';
            const { owner, repo } = context.repo;
            const workflowFile = 'pre-commit-tests.yml';

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              event: 'pull_request',
              head_sha: headSha,
              per_page: 20,
            });

            const pullRequestRun = data.workflow_runs.find(
              (run) => run.path === `.github/workflows/${workflowFile}`,
            );

            if (!pullRequestRun) {
              core.setFailed(
                `No pull_request workflow run found for ${workflowFile} at ${headSha}`,
              );
              return;
            }

            await github.rest.actions.reRunWorkflow({
              owner,
              repo,
              run_id: pullRequestRun.id,
            });

            core.notice(
              `Re-ran pull_request workflow ${pullRequestRun.id} for ${headSha}`,
              { title: 'CI approval gate' },
            );

  pre-commit-tests:
    needs: approval-gate
    runs-on: ubuntu-latest
    if: >
      always() &&
      !cancelled() &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'pull_request' &&
        needs.approval-gate.outputs.approved == 'true'))
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      HAS_CERTIFIED_HUB: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      ANSIBLE_GALAXY_SERVER_LIST: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'certified,galaxy' || 'galaxy' }}
      ANSIBLE_GALAXY_SERVER_CERTIFIED_URL: https://console.redhat.com/api/automation-hub/content/published/
      ANSIBLE_GALAXY_SERVER_CERTIFIED_AUTH_URL: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
      ANSIBLE_GALAXY_SERVER_CERTIFIED_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CRC_PUBLISH_KEY || '' }}
      ANSIBLE_GALAXY_SERVER_GALAXY_URL: https://galaxy.ansible.com/api/
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set Ansible collections cache key
        id: collections_cache_key
        run: |
          hash=$(sha256sum .github/collections/requirements.yml galaxy.yml .pre-commit-config.yaml | sha256sum | cut -d' ' -f1)
          echo "key=ansible-collections-${hash}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore Ansible collections cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: collections_cache
        with:
          path: ~/.ansible/collections
          key: ${{ steps.collections_cache_key.outputs.key }}
          restore-keys: |
            ansible-collections-

      - name: Install Ansible Galaxy collections
        id: install_collections
        if: >
          env.HAS_CERTIFIED_HUB == 'true' &&
          (steps.collections_cache.outputs.cache-hit != 'true' || github.event_name == 'schedule')
        run: |
          pip install ansible
          ansible-galaxy collection install -r .github/collections/requirements.yml

      - name: Require Ansible collections cache for external PRs
        if: >
          env.HAS_CERTIFIED_HUB != 'true' &&
          steps.collections_cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::Ansible collections cache miss for an external PR. Collections require Automation Hub credentials and are restored from the default-branch cache populated by push to devel or the daily schedule."
          exit 1

      - name: Run default pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Install system dependencies for EDA collection
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsystemd-dev pkg-config libkrb5-dev

      - name: Run sanity (manual stage)
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --hook-stage manual sanity --all-files

      - name: Save Ansible collections cache
        if: >
          matrix.python-version == '3.12' &&
          (github.event_name == 'push' || github.event_name == 'schedule') &&
          steps.install_collections.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.ansible/collections
          key: ${{ steps.collections_cache_key.outputs.key }}

  # Single check name for branch protection (matrix jobs report as pre-commit-tests (3.x)).
  pre-commit:
    needs: pre-commit-tests
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.pre-commit-tests.result == 'success' }}
    steps:
      - run: echo "All pre-commit matrix jobs passed."
