---
# PR tests are triggered by workflow_run after the trusted pre-commit approval
# workflow completes. This workflow file always runs from the default branch,
# while pull request code is checked out via refs/pull/<number>/head.
# Fork pull requests still run without Automation Hub secrets.
name: pre-commit and sanity tests

on:
  workflow_run:
    workflows: ["pre-commit approval"]
    types: [completed]
    # Do not filter by branches here: pull_request_target runs report the PR
    # head branch (e.g. test), not the base branch (devel).
  push:
    branches: [devel]
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write

jobs:
  approval-gate:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.check.outputs.approved }}
      head_sha: ${{ steps.check.outputs.head_sha }}
      head_repo_full_name: ${{ steps.check.outputs.head_repo_full_name }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - name: Validate approval workflow completion
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            if (run.conclusion !== 'success' || run.event !== 'pull_request_target') {
              core.setOutput('approved', 'false');
              core.notice(
                `Workflow run not eligible: conclusion=${run.conclusion}, event=${run.event}`,
                { title: 'CI approval gate' },
              );
              return;
            }

            const pullRequests = run.pull_requests ?? [];
            let pullRequestMeta = pullRequests[0];
            if (!pullRequestMeta) {
              const headOwner = run.head_repository?.owner?.login ?? owner;
              const { data: openPullRequests } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${headOwner}:${run.head_branch}`,
              });
              pullRequestMeta = openPullRequests.find((item) => item.head.sha === run.head_sha);
            }
            if (!pullRequestMeta) {
              core.setOutput('approved', 'false');
              core.notice('No pull request found for workflow run', { title: 'CI approval gate' });
              return;
            }

            const { data: jobsResponse } = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: run.id,
            });
            const approvalJob = jobsResponse.jobs.find(
              (job) =>
                (job.name === 'auto-approve' || job.name === 'manual-approval') &&
                job.conclusion === 'success',
            );
            if (!approvalJob) {
              core.setOutput('approved', 'false');
              core.notice('No successful approval job in workflow run', { title: 'CI approval gate' });
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullRequestMeta.number,
            });

            if (pullRequest.base.ref !== 'devel') {
              core.setOutput('approved', 'false');
              core.notice(
                `Pull request #${pullRequest.number} targets ${pullRequest.base.ref}, expected devel`,
                { title: 'CI approval gate' },
              );
              return;
            }

            if (pullRequest.state !== 'open') {
              core.setOutput('approved', 'false');
              core.notice(`Pull request #${pullRequest.number} is ${pullRequest.state}`, { title: 'CI approval gate' });
              return;
            }

            if (pullRequest.head.sha !== run.head_sha) {
              core.setOutput('approved', 'false');
              core.notice(
                `Head SHA mismatch: pr=${pullRequest.head.sha}, workflow_run=${run.head_sha}`,
                { title: 'CI approval gate' },
              );
              return;
            }

            core.setOutput('approved', 'true');
            core.setOutput('head_sha', pullRequest.head.sha);
            core.setOutput('head_repo_full_name', pullRequest.head.repo.full_name);
            core.setOutput('pr_number', String(pullRequest.number));

            core.summary
              .addHeading('CI approval gate')
              .addRaw(`- PR: #${pullRequest.number}\n`)
              .addRaw(`- Head SHA: ${pullRequest.head.sha}\n`)
              .addRaw(`- Head repository: ${pullRequest.head.repo.full_name}\n`)
              .addRaw(`- Approval job: ${approvalJob.name}\n`)
              .addRaw('- Approved: true\n')
              .write();

  pr-check-start:
    needs: approval-gate
    if: >-
      github.event_name == 'workflow_run' &&
      needs.approval-gate.outputs.approved == 'true'
    runs-on: ubuntu-latest
    outputs:
      check_run_id: ${{ steps.start.outputs.check_run_id }}
    steps:
      - name: Start pull request check run
        id: start
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const response = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'pre-commit',
              head_sha: '${{ needs.approval-gate.outputs.head_sha }}',
              status: 'in_progress',
              started_at: new Date().toISOString(),
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: 'Pre-commit and sanity tests',
                summary: 'Running pre-commit and sanity tests after CI approval.',
              },
            });
            core.setOutput('check_run_id', String(response.data.id));

  pre-commit-tests:
    needs: [approval-gate, pr-check-start]
    runs-on: ubuntu-latest
    if: >
      always() &&
      !cancelled() &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_run' &&
        needs.approval-gate.outputs.approved == 'true' &&
        needs.pr-check-start.result == 'success'))
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      HAS_CERTIFIED_HUB: ${{ github.event_name != 'workflow_run' || needs.approval-gate.outputs.head_repo_full_name == github.repository }}
      ANSIBLE_GALAXY_SERVER_LIST: ${{ (github.event_name != 'workflow_run' || needs.approval-gate.outputs.head_repo_full_name == github.repository) && 'certified,galaxy' || 'galaxy' }}
      ANSIBLE_GALAXY_SERVER_CERTIFIED_URL: https://console.redhat.com/api/automation-hub/content/published/
      ANSIBLE_GALAXY_SERVER_CERTIFIED_AUTH_URL: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
      ANSIBLE_GALAXY_SERVER_CERTIFIED_TOKEN: ${{ (github.event_name != 'workflow_run' || needs.approval-gate.outputs.head_repo_full_name == github.repository) && secrets.CRC_PUBLISH_KEY || '' }}
      ANSIBLE_GALAXY_SERVER_GALAXY_URL: https://galaxy.ansible.com/api/
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && format('refs/pull/{0}/head', needs.approval-gate.outputs.pr_number) || github.sha }}

      - name: Set Ansible collections cache key
        id: collections_cache_key
        run: |
          hash=$(sha256sum .github/collections/requirements.yml galaxy.yml .pre-commit-config.yaml | sha256sum | cut -d' ' -f1)
          echo "key=ansible-collections-${hash}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore Ansible collections cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: collections_cache
        with:
          path: ~/.ansible/collections
          key: ${{ steps.collections_cache_key.outputs.key }}
          restore-keys: |
            ansible-collections-

      - name: Install Ansible Galaxy collections
        id: install_collections
        if: >
          env.HAS_CERTIFIED_HUB == 'true' &&
          (steps.collections_cache.outputs.cache-hit != 'true' || github.event_name == 'schedule')
        run: |
          pip install ansible
          ansible-galaxy collection install -r .github/collections/requirements.yml

      - name: Require Ansible collections cache for external PRs
        if: >
          env.HAS_CERTIFIED_HUB != 'true' &&
          steps.collections_cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::Ansible collections cache miss for an external PR. Collections require Automation Hub credentials and are restored from the default-branch cache populated by push to devel or the daily schedule."
          exit 1

      - name: Run default pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Install system dependencies for EDA collection
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsystemd-dev pkg-config libkrb5-dev

      - name: Run sanity (manual stage)
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --hook-stage manual sanity --all-files

      - name: Save Ansible collections cache
        if: >
          matrix.python-version == '3.12' &&
          (github.event_name == 'push' || github.event_name == 'schedule') &&
          steps.install_collections.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.ansible/collections
          key: ${{ steps.collections_cache_key.outputs.key }}

  # Reports a single pre-commit check on pull requests (workflow_run does not do
  # this automatically). Use this check name in branch protection rules.
  pre-commit:
    needs: [approval-gate, pr-check-start, pre-commit-tests]
    runs-on: ubuntu-latest
    if: >
      always() &&
      !cancelled() &&
      (github.event_name != 'workflow_run'
        ? needs.pre-commit-tests.result == 'success'
        : needs.pr-check-start.result == 'success')
    steps:
      - name: Complete pull request check run
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const success = '${{ needs.pre-commit-tests.result }}' === 'success';
            const summary = success
              ? 'All Python 3.12, 3.13, and 3.14 matrix jobs passed.'
              : 'One or more pre-commit matrix jobs failed. See the workflow run for details.';

            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number('${{ needs.pr-check-start.outputs.check_run_id }}'),
              status: 'completed',
              conclusion: success ? 'success' : 'failure',
              completed_at: new Date().toISOString(),
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: success ? 'All pre-commit matrix jobs passed' : 'Pre-commit tests failed',
                summary,
              },
            });

            if (!success) {
              core.setFailed(summary);
            }

      - name: All pre-commit matrix jobs passed
        if: needs.pre-commit-tests.result == 'success'
        run: echo "All pre-commit matrix jobs passed."
