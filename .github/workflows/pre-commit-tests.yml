---
# Untrusted code execution: pull_request (fork PRs have no secrets).
# After approval, pre-commit-tests-rerun.yml re-runs this workflow via workflow_run.
# Push/schedule runs populate the Ansible collections cache for external PRs.
name: pre-commit and sanity tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [devel]
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  approval-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.check.outputs.approved }}
    steps:
      - name: Validate CI approval for pull request head SHA
        id: check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullRequest = context.payload.pull_request;
            const headSha = pullRequest.head.sha;

            if (pullRequest.base.ref !== 'devel') {
              core.setOutput('approved', 'false');
              core.notice(
                `Pull request #${pullRequest.number} targets ${pullRequest.base.ref}, expected devel`,
                { title: 'CI approval gate' },
              );
              return;
            }

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'pre-commit-approve.yml',
              head_sha: headSha,
              event: 'pull_request_target',
              status: 'completed',
              per_page: 20,
            });

            const approvalRun = runs.workflow_runs.find((item) => item.conclusion === 'success');
            if (!approvalRun) {
              core.setOutput('approved', 'false');
              core.notice(
                `No successful pre-commit approval workflow run found for ${headSha}`,
                { title: 'CI approval gate' },
              );
              return;
            }

            const { data: jobsResponse } = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: approvalRun.id,
            });
            const approvalJob = jobsResponse.jobs.find(
              (job) =>
                (job.name === 'auto-approve' || job.name === 'manual-approval') &&
                job.conclusion === 'success',
            );
            if (!approvalJob) {
              core.setOutput('approved', 'false');
              core.notice('No successful approval job found for head SHA', { title: 'CI approval gate' });
              return;
            }

            core.setOutput('approved', 'true');

  pre-commit-tests:
    needs: approval-gate
    runs-on: ubuntu-latest
    if: >
      always() &&
      !cancelled() &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'pull_request' &&
        needs.approval-gate.outputs.approved == 'true'))
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      HAS_CERTIFIED_HUB: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      ANSIBLE_GALAXY_SERVER_LIST: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'certified,galaxy' || 'galaxy' }}
      ANSIBLE_GALAXY_SERVER_CERTIFIED_URL: https://console.redhat.com/api/automation-hub/content/published/
      ANSIBLE_GALAXY_SERVER_CERTIFIED_AUTH_URL: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
      ANSIBLE_GALAXY_SERVER_CERTIFIED_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CRC_PUBLISH_KEY || '' }}
      ANSIBLE_GALAXY_SERVER_GALAXY_URL: https://galaxy.ansible.com/api/
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore Ansible collections cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        id: collections_cache
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('.github/collections/requirements.yml', 'galaxy.yml', '.pre-commit-config.yaml') }}
          restore-keys: |
            ansible-collections-

      - name: Install Ansible Galaxy collections
        id: install_collections
        if: >
          env.HAS_CERTIFIED_HUB == 'true' &&
          (steps.collections_cache.outputs.cache-hit != 'true' || github.event_name == 'schedule')
        run: |
          pip install ansible
          ansible-galaxy collection install -r .github/collections/requirements.yml

      - name: Require Ansible collections cache for external PRs
        if: >
          env.HAS_CERTIFIED_HUB != 'true' &&
          steps.collections_cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::Ansible collections cache miss for an external PR. Collections require Automation Hub credentials and are restored from the default-branch cache populated by push to devel or the daily schedule."
          exit 1

      - name: Run default pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Install system dependencies for EDA collection
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsystemd-dev pkg-config libkrb5-dev

      - name: Run sanity (manual stage)
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --hook-stage manual sanity --all-files

      - name: Save Ansible collections cache
        if: >
          matrix.python-version == '3.12' &&
          (github.event_name == 'push' || github.event_name == 'schedule') &&
          steps.install_collections.outcome == 'success'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('.github/collections/requirements.yml', 'galaxy.yml', '.pre-commit-config.yaml') }}

  # Single check name for branch protection (matrix jobs report as pre-commit-tests (3.x)).
  pre-commit:
    needs: pre-commit-tests
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.pre-commit-tests.result == 'success' }}
    steps:
      - run: echo "All pre-commit matrix jobs passed."
