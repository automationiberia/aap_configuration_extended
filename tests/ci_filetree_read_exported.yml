---
# Import filetree_create "default" layout (same shape as tests/configs/fc) into a target AAP 2.5+ instance.
# Run after test_filetree_create.yaml with -e filetree_ci_keep_output=true so /tmp/filetree_output_default exists.
#
# Connection: CONTROLLER_HOST, CONTROLLER_USERNAME, CONTROLLER_PASSWORD, CONTROLLER_VERIFY_SSL
# (same as ansible.controller / infra.aap_configuration).
#
- name: Get gateway OAuth token (always)
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - always
  vars:
    __aap_username: "{{ vault_aap_username | default(lookup('env', 'CONTROLLER_USERNAME')) }}"
    __aap_password: "{{ vault_aap_password | default(lookup('env', 'CONTROLLER_PASSWORD')) }}"
    __aap_hostname: "{{ vault_aap_hostname | default(lookup('env', 'CONTROLLER_HOST')) }}"
    __aap_validate_certs: "{{ vault_aap_validate_certs | default(lookup('env', 'CONTROLLER_VERIFY_SSL') | default(true) | bool) }}"
  tasks:
    - name: Declare connection variables for following plays
      ansible.builtin.set_fact:
        aap_username: "{{ __aap_username }}"
        aap_password: "{{ __aap_password }}"
        aap_hostname: "{{ __aap_hostname }}"
        aap_validate_certs: "{{ __aap_validate_certs }}"

    - name: Setup authentication
      no_log: "{{ controller_configuration_filetree_create_secure_logging | default(true) }}"
      when: aap_oauthtoken is not defined
      block:
        - name: Get authentication token
          ansible.builtin.uri:
            url: "https://{{ aap_hostname }}/api/gateway/v1/tokens/"
            user: "{{ aap_username }}"
            password: "{{ aap_password }}"
            method: POST
            force_basic_auth: true
            validate_certs: "{{ aap_validate_certs }}"
            status_code: 201
          register: authtoken_res

        - name: Record token for filetree_read / dispatch
          ansible.builtin.set_fact:
            aap_oauthtoken: "{{ authtoken_res.json.token }}"
            aap_token: "{{ authtoken_res.json.token }}"
            aap_oauthtoken_url: "{{ authtoken_res.json.url }}"

- name: Apply exported filetree (default layout) via filetree_read + dispatch
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    dir_orgs_vars: ''
    orgs: ''
    filetree_export_root: "{{ filetree_ci_export_root | default('/tmp/filetree_output_default') }}"
    filetree_controller_settings: "{{ filetree_export_root }}"
    filetree_aap_organizations: "{{ filetree_export_root }}"
    filetree_controller_labels: "{{ filetree_export_root }}"
    filetree_aap_user_accounts: "{{ filetree_export_root }}"
    filetree_aap_teams: "{{ filetree_export_root }}"
    filetree_controller_credential_types: "{{ filetree_export_root }}"
    filetree_controller_credentials: "{{ filetree_export_root }}"
    filetree_controller_credential_input_sources: "{{ filetree_export_root }}"
    filetree_controller_notifications: "{{ filetree_export_root }}"
    filetree_controller_projects: "{{ filetree_export_root }}"
    filetree_controller_execution_environments: "{{ filetree_export_root }}"
    filetree_aap_applications: "{{ filetree_export_root }}"
    filetree_controller_inventories: "{{ filetree_export_root }}"
    filetree_controller_inventory_sources: "{{ filetree_export_root }}"
    filetree_controller_instance_groups: "{{ filetree_export_root }}"
    filetree_controller_hosts: "{{ filetree_export_root }}"
    filetree_controller_groups: "{{ filetree_export_root }}"
    filetree_controller_templates: "{{ filetree_export_root }}"
    filetree_controller_workflow_job_templates: "{{ filetree_export_root }}"
    filetree_controller_schedules: "{{ filetree_export_root }}"
    filetree_controller_roles: "{{ filetree_export_root }}"
  roles:
    - infra.aap_configuration_extended.filetree_read
    - infra.aap_configuration.dispatch

- name: Delete OAuth token (always)
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - always
  vars:
    aap_username: "{{ vault_aap_username | default(lookup('env', 'CONTROLLER_USERNAME')) }}"
    aap_password: "{{ vault_aap_password | default(lookup('env', 'CONTROLLER_PASSWORD')) }}"
    aap_hostname: "{{ vault_aap_hostname | default(lookup('env', 'CONTROLLER_HOST')) }}"
    aap_validate_certs: "{{ vault_aap_validate_certs | default(lookup('env', 'CONTROLLER_VERIFY_SSL') | default(true) | bool) }}"
  tasks:
    - name: Delete authentication token
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}{{ aap_oauthtoken_url }}"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        method: DELETE
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 204
      when: aap_oauthtoken_url is defined
...
