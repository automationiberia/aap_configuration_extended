---
# Prepare origin AAP (instance A) with minimal objects expected by live regression
# tests before they run. Idempotent — safe to re-run.
#
# Ensures:
#   - OAuth token (ansible.platform.token)
#   - Organization "Default" (usually already present)
#   - Machine credential "roundtrip-rbac-credential" (needed by gateway RBAC
#     resolve test and roundtrip gateway_role_user_assignments.yaml)
#   - Credential Admin assignment for admin on that credential (numeric object_id;
#     gateway name→id for controller credentials is unreliable — see
#     test_gateway_role_user_assignments_resolve.yaml)
#
# Example:
#   ansible-playbook tests/prepare_aap_origin.yml -e @tests/vault-aap-a.yaml
#
- name: Prepare AAP origin for live regression
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_username: "{{ vault_aap_username | default(lookup('env', 'CONTROLLER_USERNAME')) }}"
    aap_password: "{{ vault_aap_password | default(lookup('env', 'CONTROLLER_PASSWORD')) }}"
    aap_hostname: "{{ vault_aap_hostname | default(lookup('env', 'CONTROLLER_HOST')) }}"
    aap_validate_certs: "{{ vault_aap_validate_certs | default(lookup('env', 'CONTROLLER_VERIFY_SSL') | default(false) | bool) }}"
    aap_organizations:
      - name: Default
    controller_credentials:
      - name: roundtrip-rbac-credential
        credential_type: Machine
        organization: Default
        description: Credential for roundtrip gateway role user assignment tests
        inputs:
          username: roundtrip
          password: "{{ vaulted_controller_credentials_roundtrip_rbac_credential_password | default('roundtrip') }}"

  pre_tasks:
    - name: Setup authentication
      no_log: true
      when: not (ansible_facts.get('aap_token') or aap_token is defined)
      block:
        - name: Create a new token using platform username/password
          ansible.platform.token:
            description: Token for Automated Management
            scope: write
            state: present
            aap_hostname: "{{ aap_hostname }}"
            aap_username: "{{ aap_username }}"
            aap_password: "{{ aap_password }}"
            aap_validate_certs: "{{ aap_validate_certs }}"

    - name: Expose aap_token dict for downstream roles
      ansible.builtin.set_fact:
        aap_token: "{{ ansible_facts['aap_token'] }}"
      when:
        - ansible_facts.get('aap_token') is defined
        - aap_token is not defined

  roles:
    - role: infra.aap_configuration.gateway_organizations
    - role: infra.aap_configuration.controller_credentials

  post_tasks:
    - name: Look up credential id via controller API
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/controller/v2/credentials/?name=roundtrip-rbac-credential"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token.token | default(aap_token) }}"
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 200
      register: __prep_cred_lookup
      no_log: true

    - name: Assert prepare credential exists
      ansible.builtin.assert:
        that:
          - (__prep_cred_lookup.json.count | default(0) | int) >= 1
        fail_msg: Failed to create or find roundtrip-rbac-credential on origin AAP.

    - name: Ensure gateway RBAC assignments for prepared objects
      ansible.builtin.include_role:
        name: infra.aap_configuration.gateway_role_user_assignments
      vars:
        gateway_role_user_assignments:
          - role_definition: Organization Member
            object_ids:
              - Default
            user: admin
          - role_definition: Credential Admin
            object_ids:
              - "{{ __prep_cred_lookup.json.results[0].id }}"
            user: admin

    - name: Show prepare summary
      ansible.builtin.debug:
        msg: >-
          Origin AAP {{ aap_hostname }} ready: org Default, credential
          roundtrip-rbac-credential (id={{ __prep_cred_lookup.json.results[0].id }}),
          and related gateway role assignments.

    - name: Delete OAuth token
      when: aap_token is defined
      no_log: true
      ansible.platform.token:
        aap_hostname: "{{ aap_hostname }}"
        aap_username: "{{ aap_username }}"
        aap_password: "{{ aap_password }}"
        aap_validate_certs: "{{ aap_validate_certs }}"
        aap_token: "{{ aap_token }}"
        state: absent
...
